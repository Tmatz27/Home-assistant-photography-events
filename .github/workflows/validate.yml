name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  ha-contracts:
    name: Home Assistant contracts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            homeassistant: "2024.11.3"
          - python: "3.13"
            homeassistant: "2025.3.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only Home Assistant
        run: python -m pip install -c tests/ha-constraints.txt "homeassistant==${{ matrix.homeassistant }}" beautifulsoup4
      - name: Exercise coordinator, entities and real Store
        run: |
          python -c "import homeassistant.core"
          python -m unittest discover -s tests -p test_ha_integration.py -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate for HACS
        uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing integration dependency
        run: python -m pip install "beautifulsoup4>=4.12.0" pyflakes

      - name: Unit tests
        run: |
          npm test
          python -m pyflakes custom_components/photography_events/*.py tools/*.py
