<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photography card review — synthetic examples</title>
<style>body{margin:0;background:#111;color:#e8e8e8;font:16px system-ui;--primary-text-color:#e8e8e8;--secondary-text-color:#a8acb3;--card-background-color:#222528;--divider-color:#ffffff20;--primary-color:#91bca0}main{max-width:1150px;margin:auto;padding:28px}.cards{display:grid;grid-template-columns:430px minmax(0,1fr);gap:24px;align-items:start}ha-card{display:block;background:#222528;border:1px solid #ffffff20;border-radius:20px}h1{font-size:22px}h2{font-size:16px}.note{font-size:13px;color:#aaa;margin-bottom:28px}button{font-family:inherit} @media(max-width:800px){.cards{grid-template-columns:1fr}} </style>
</head><body><main><h1>Photography Events · card review</h1><p class="note">Synthetic examples for layout and interaction testing. These are not current sighting reports or forecasts.</p><div class="test-controls" style="position:sticky;top:0;background:#222;padding:10px;z-index:10;display:flex;flex-wrap:wrap;gap:8px"><button id="live">Start automatic updates</button><button id="refresh">Push update</button><button id="offline">Disconnect / reconnect</button><button id="stale">Age calendar 2 hours</button><button id="unavailable">Unavailable / recover</button><button id="failure">Fail / restore saves</button><button id="stress">Load 400 events</button><output id="metrics"></output></div><div class="cards"><section><h2>Main dashboard</h2><photography-events-card id="week"></photography-events-card></section><section><h2>Year planner</h2><photography-events-card id="year"></photography-events-card></section></div></main>
<script type="module" src="../custom_components/photography_events/www/photography-events-card.js"></script>
<script type="module">
const at=(d,h=20)=>{let t=new Date();t.setDate(t.getDate()+d);t.setHours(h,0,0,0);return t.toISOString()};
const events=[];
for(let d=0;d<9;d++)for(const [z,name,drive]of [['carrizo','Carrizo Plain',2.5],['pinos','Mount Pinos',2.1],['sierra','Eastern Sierra',5]])events.push({key:`milkyway-${z}-${d}`,event_id:`milkyway-night-${d}`,roll:`milkyway-${d}`,title:`Milky Way core at ${name}`,category:'astronomy',zone:name,where:name,zone_id:z,start:at(d),end:at(d,22),score:d===3?96:86-d,cloud_cover:d===3?8:20+d*4,cloud_is_forecast:d<=7,cloud_confidence:d<=7?'forecast':'outlook',duration_minutes:100-d*3,moon_illumination:.16-d*.016,peak_altitude:24,drive_hours:drive,verification:'computed',detail:'The usable window intersects full darkness, core elevation and tolerable moonlight.'});
events.push({key:'elk',event_id:'elk',degraded_sources:['inaturalist'],source_health_note:'iNaturalist: recent sightings cannot be refreshed. Rut behavior still needs explicit evidence.',title:'Tule elk rut',category:'mammals',zone:'Tomales Point',start:at(-5).slice(0,10),end:at(25).slice(0,10),all_day:true,score:60,verification:'watching',season_range:'August to October',awaiting:'A recent dated report of rut behavior in this herd.',locations:['Tomales Point','Carrizo Plain'],detail:'Dawn offers cooler air and the most active period. Herds peak on different dates.',gear:'200–600mm telephoto'});
events.push({key:'surf',event_id:'surf',title:'Exceptional Pacific swell',category:'waves',zone:'Elevated coastal viewpoints',start:at(2),end:at(4),score:90,verification:'forecast',wave_height_m:6.4,wave_period_s:19,measurement_label:'Offshore significant wave height',confidence_note:'Synthetic model example, not a surf forecast.',source_url:'https://www.ndbc.noaa.gov/station_page.php?station=46011'});
for(let i=0;i<(new URLSearchParams(location.search).has("stress")?18:0);i++)events.push({key:`demo-${i}`,title:`Example seasonal subject ${i+1}`,category:['blooms','foliage','marine'][i%3],zone:'Example viewing location',start:at(-i).slice(0,10),end:at(10+i).slice(0,10),all_day:true,score:45,verification:'watching',detail:'Synthetic row used to verify scrolling and section collapse.'});
const future=(m,d)=>{const t=new Date();let y=t.getFullYear();if(m<t.getMonth())y++;return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
events.push({key:'firefall',title:'Yosemite Horsetail Fall firefall',category:'rare_phenomena',zone:'El Capitan Picnic Area',start:future(1,12),end:future(1,26),all_day:true,precision:'season',season_range:'Mid-February only',score:45,verification:'unverified',awaiting:'Flowing water, a clear western horizon and current NPS access information.',detail:'Typical light-alignment season; a dated flow and weather check is still needed.',verify:['https://www.nps.gov/yose/planyourvisit/horsetailfall.htm']});
events.push({key:'moonbow',title:'Yosemite moonbow candidate nights',category:'rare_phenomena',zone:'Yosemite Falls',start:future(3,19),end:future(3,23),all_day:true,score:55,verification:'unverified',awaiting:'Viewpoint-specific moonbow geometry and current waterfall flow. Synthetic dates only.',detail:'Full Moon and spray are necessary; these sample dates are not an actual prediction.'});
let connected=true, available=true, stale=false, failSaves=false; const preferences={};const cards=[document.querySelector('#week'),document.querySelector('#year')];
cards[0].setConfig({mode:'action_hero',outlook_entity:'sensor.preview'});cards[1].setConfig({mode:'calendar_outlook',outlook_entity:'sensor.preview'});
function update(){const started=performance.now();const state={state:available?String(events.length):"unavailable",attributes:{generated:new Date(Date.now()-(stale?7200000:0)).toISOString(),events,preferences:{...preferences},all_categories:['astronomy','waves','mammals','blooms','foliage','marine','rare_phenomena'],sources:{inaturalist:{name:'iNaturalist',state:'failed',enabled:true,failures:3,last_success:at(-2),impact:'Recent wildlife sightings may be missing.'},weather:{name:'Open-Meteo',state:'ok',enabled:true,failures:0,last_success:at(0,8)}},parks:{},gear_by_category:{}}};for(const card of cards)card.hass={connected,states:{'sensor.preview':state},callService:async(_,__,data)=>{if(failSaves)throw Error("Synthetic save failure");preferences[data.event_id]={choice:data.choice};update()}};document.querySelector('#metrics').textContent=`${events.length} payload rows · ${(performance.now()-started).toFixed(1)} ms synchronous render · saves ${failSaves?'FAIL':'OK'}`;}update();
let automatic;document.querySelector('#live').onclick=()=>{if(automatic){clearInterval(automatic);automatic=null;document.querySelector('#live').textContent='Start automatic updates'}else{automatic=setInterval(()=>{events[9].score=events[9].score===99?96:99;update()},5000);document.querySelector('#live').textContent='Stop automatic updates'}};
document.querySelector('#refresh').onclick=()=>{stale=false;update()};
document.querySelector('#offline').onclick=()=>{connected=!connected;update()};
document.querySelector('#stale').onclick=()=>{stale=true;update()};
document.querySelector('#unavailable').onclick=()=>{available=!available;update()};
document.querySelector('#failure').onclick=()=>{failSaves=!failSaves;update()};
document.querySelector('#stress').onclick=()=>{for(let i=events.length;i<400;i++)events.push({key:`load-${i}`,title:`Synthetic subject ${i}`,category:['blooms','foliage','marine'][i%3],start:at(i%300).slice(0,10),end:at(i%300+7).slice(0,10),all_day:true,score:40,verification:'watching',detail:'Synthetic load-test event.'});update()};
</script></body></html>
