ingest_report:
  name: Legacy report ingestion (unavailable)
  description: This retired service always returns an unsupported error. HA does not parse, collect or corroborate reports in the read-only Core build. Legacy automation payloads are not processed.
set_event_choice:
  name: Event choices (unavailable)
  description: Follow, Skip and Seen are unavailable until Core persistence exists. This service never saves a local choice, changes an action entity or generates a notification.
  fields:
    event_id:
      name: Legacy event identifier
      required: false
      selector:
        text:
    choice:
      name: Unavailable choice
      required: false
      selector:
        select:
          options:
            - default
            - follow
            - skip
            - seen
