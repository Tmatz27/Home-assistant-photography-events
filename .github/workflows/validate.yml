name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  core-wire-compatibility:
    name: Pinned Core schema 0010 routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tmatz27/photography-events-core
          ref: 10bde5f0dcb57821f36a971af9e3dc4183271202
          fetch-depth: 0
          path: evidence/core-schema0010
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Core verification dependencies
        run: python -m pip install -r evidence/core-schema0010/requirements-dev.lock
      - name: Reproduce accepted API routes and authentication boundaries
        run: python tools/verify_core_schema0010.py --core-source evidence/core-schema0010 > evidence/core-schema0010-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-schema0010-verification
          path: evidence/core-schema0010-verification.json

  ha-contracts:
    name: Home Assistant contracts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            homeassistant: "2024.11.3"
          - python: "3.13"
            homeassistant: "2025.3.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only Home Assistant
        run: |
          python -m venv .ha-test-venv
          .ha-test-venv/bin/python -m pip install -c tests/ha-constraints.txt "homeassistant==${{ matrix.homeassistant }}" beautifulsoup4
          echo "$PWD/.ha-test-venv/bin" >> "$GITHUB_PATH"
      - name: Exercise coordinator, entities and real Store
        run: |
          python -c "import homeassistant.core"
          python -m unittest discover -s tests -p "test_ha_v17b.py" -v
          python -m unittest discover -s tests -p "test_ha_*.py" -v

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate for HACS
        uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing integration dependency
        run: python -m pip install "beautifulsoup4>=4.12.0" pyflakes aiohttp

      - name: Unit tests
        run: |
          npm test
          python -m pyflakes custom_components/photography_events/*.py tools/*.py
          python -m pyflakes tests/test_v17b_runtime.py tests/test_ha_v17b.py tests/v17b_fixtures.py tests/test_core_schema_compatibility.py
          python -m pyflakes tests/test_core_schema0010.py tests/test_ha_release_policy.py
          python tools/verify_v17b_boundaries.py
